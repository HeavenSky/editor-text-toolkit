<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-label="Editor Text Toolkit">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2E3547"/>
      <stop offset="1" stop-color="#171B26"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6FD6FF"/>
      <stop offset="1" stop-color="#3E8BFF"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="256" height="256" rx="56" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="253" height="253" rx="54.5" fill="none" stroke="#3C4459" stroke-width="3"/>

  <!-- 行号槽: 对应"复制路径 + 行号" -->
  <circle cx="46" cy="88" r="4.5" fill="#5D6880"/>
  <circle cx="46" cy="128" r="4.5" fill="#5D6880"/>
  <circle cx="46" cy="168" r="4.5" fill="#5D6880"/>

  <!-- 左侧正文: 长度不一, 代表未对齐的内容 -->
  <rect x="68" y="80" width="46" height="16" rx="8" fill="#9AA6BF"/>
  <rect x="68" y="120" width="30" height="16" rx="8" fill="#9AA6BF"/>
  <rect x="68" y="160" width="38" height="16" rx="8" fill="#9AA6BF"/>

  <!-- 对齐列: 三行在同一列对齐, 对应 Align by RegEx -->
  <rect x="122" y="62" width="10" height="132" rx="5" fill="url(#accent)"/>

  <!-- 右侧内容: 全部从对齐列起始 -->
  <rect x="145" y="80" width="52" height="16" rx="8" fill="#E6EBF5"/>
  <rect x="145" y="120" width="66" height="16" rx="8" fill="#6FD6FF"/>
  <rect x="145" y="160" width="40" height="16" rx="8" fill="#E6EBF5"/>
</svg>
